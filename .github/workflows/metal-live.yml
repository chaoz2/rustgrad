name: RustGrad Live Metal

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed lowercase 40-character commit SHA
        required: true
        type: string

concurrency:
  group: live-metal-${{ inputs.expected_sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  live-metal:
    name: Live Metal (Apple GPU)
    runs-on: [self-hosted, macOS, ARM64, rustgrad-metal]
    environment: live-metal
    timeout-minutes: 30
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      RUSTGRAD_METAL_EXPECTED_SHA: ${{ inputs.expected_sha }}
      RUSTGRAD_METAL_SCOREBOARD_PATH: ${{ github.workspace }}/metal-live-linear-scoreboard.json
      RUSTGRAD_METAL_RESNET_SCOREBOARD_PATH: ${{ github.workspace }}/metal-live-resnet18-scoreboard.json
      RUSTGRAD_METAL_RESNET_OBSERVATION_PATH: ${{ github.workspace }}/metal-live-resnet18-observation-v1.json
      RUSTGRAD_METAL_RESNET_RUNS: "10"
    steps:
      - name: Validate requested revision
        shell: bash
        run: |
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "expected_sha must be a lowercase full Git SHA" >&2
            exit 1
          fi
          if [[ "${GITHUB_SHA:-}" != "$EXPECTED_SHA" ]]; then
            echo "workflow dispatch revision does not match expected_sha" >&2
            exit 1
          fi
      - name: Check out exact reviewed revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Authenticate checkout
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$EXPECTED_SHA" ]]; then
            echo "checked-out revision does not match expected_sha" >&2
            exit 1
          fi
          for output_path in \
            "$RUSTGRAD_METAL_SCOREBOARD_PATH" \
            "$RUSTGRAD_METAL_RESNET_SCOREBOARD_PATH" \
            "$RUSTGRAD_METAL_RESNET_OBSERVATION_PATH"; do
            if [[ -e "$output_path" || -L "$output_path" ]]; then
              echo "live Metal evidence path already exists: $output_path" >&2
              exit 1
            fi
          done
          os_label="macOS $(sw_vers -productVersion) ($(sw_vers -buildVersion)); $(uname -m)"
          if [[ "$os_label" == *$'\n'* || "$os_label" == *$'\r'* ]]; then
            echo "runner operating-system label must be single-line" >&2
            exit 1
          fi
          printf 'RUSTGRAD_METAL_RESNET_OPERATING_SYSTEM=%s\n' "$os_label" >> "$GITHUB_ENV"
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1d1eb14921d9c2d8ea575663e5fe3a0b57868a05
        with:
          toolchain: 1.89.0
      - name: Run exact live Metal Linear acceptance
        shell: bash
        run: >-
          cargo test --release --test metal_live
          live_metal_linear_persistent_session_emits_scoreboard --
          --ignored --nocapture --test-threads=1
      - name: Benchmark exact live Metal ResNet-18
        shell: bash
        run: cargo run --release --example metal_resnet_benchmark
      - name: Print live evidence
        shell: bash
        run: |
          cat "$RUSTGRAD_METAL_SCOREBOARD_PATH"
          cat "$RUSTGRAD_METAL_RESNET_SCOREBOARD_PATH"
          cat "$RUSTGRAD_METAL_RESNET_OBSERVATION_PATH"
      - name: Upload live Metal evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: metal-live-${{ inputs.expected_sha }}
          path: |
            ${{ env.RUSTGRAD_METAL_SCOREBOARD_PATH }}
            ${{ env.RUSTGRAD_METAL_RESNET_SCOREBOARD_PATH }}
            ${{ env.RUSTGRAD_METAL_RESNET_OBSERVATION_PATH }}
          if-no-files-found: error
          retention-days: 30

  live-metal-llama:
    name: Live Metal GGUF Llama scoreboard v2 (Apple GPU)
    runs-on: [self-hosted, macOS, ARM64, rustgrad-metal]
    environment: live-metal
    timeout-minutes: 60
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      RUSTGRAD_METAL_EXPECTED_SHA: ${{ inputs.expected_sha }}
      RUSTGRAD_METAL_LLAMA_GGUF_PATH: ${{ vars.RUSTGRAD_METAL_LLAMA_GGUF_PATH }}
      RUSTGRAD_METAL_LLAMA_GGUF_SHA256: ${{ vars.RUSTGRAD_METAL_LLAMA_GGUF_SHA256 }}
      RUSTGRAD_METAL_LLAMA_REGISTRY_ID: ${{ vars.RUSTGRAD_METAL_LLAMA_REGISTRY_ID }}
      RUSTGRAD_METAL_LLAMA_PROMPT: ${{ vars.RUSTGRAD_METAL_LLAMA_PROMPT }}
      RUSTGRAD_METAL_LLAMA_MAX_NEW_TOKENS: ${{ vars.RUSTGRAD_METAL_LLAMA_MAX_NEW_TOKENS }}
      RUSTGRAD_METAL_LLAMA_PREFILL_SPAN: ${{ vars.RUSTGRAD_METAL_LLAMA_PREFILL_SPAN }}
      RUSTGRAD_METAL_LLAMA_EXPECTED_IDS: ${{ vars.RUSTGRAD_METAL_LLAMA_EXPECTED_IDS }}
      RUSTGRAD_METAL_LLAMA_MODEL_SOURCE: ${{ vars.RUSTGRAD_METAL_LLAMA_MODEL_SOURCE }}
      RUSTGRAD_METAL_LLAMA_MODEL_LICENSE: ${{ vars.RUSTGRAD_METAL_LLAMA_MODEL_LICENSE }}
      RUSTGRAD_METAL_LLAMA_MODEL_CONVERSION: ${{ vars.RUSTGRAD_METAL_LLAMA_MODEL_CONVERSION }}
      RUSTGRAD_METAL_LLAMA_ORACLE_NAME: ${{ vars.RUSTGRAD_METAL_LLAMA_ORACLE_NAME }}
      RUSTGRAD_METAL_LLAMA_ORACLE_REVISION: ${{ vars.RUSTGRAD_METAL_LLAMA_ORACLE_REVISION }}
      RUSTGRAD_METAL_LLAMA_ORACLE_COMMAND: ${{ vars.RUSTGRAD_METAL_LLAMA_ORACLE_COMMAND }}
      RUSTGRAD_METAL_LLAMA_SCOREBOARD_PATH: ${{ github.workspace }}/metal-live-llama-scoreboard-v2.json
      RUSTGRAD_METAL_LLAMA_ATTESTATION_PATH: ${{ github.workspace }}/metal-live-llama-attestation.json
      RUSTGRAD_METAL_LLAMA_SHA256SUMS_PATH: ${{ github.workspace }}/SHA256SUMS
      RUSTGRAD_METAL_LLAMA_WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      RUSTGRAD_METAL_LLAMA_WORKFLOW_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Validate requested revision and protected configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "expected_sha must be a lowercase full Git SHA" >&2
            exit 1
          fi
          if [[ "${GITHUB_SHA:-}" != "$EXPECTED_SHA" ]]; then
            echo "workflow dispatch revision does not match expected_sha" >&2
            exit 1
          fi
          if [[ -z "$RUSTGRAD_METAL_LLAMA_GGUF_PATH" || ! -f "$RUSTGRAD_METAL_LLAMA_GGUF_PATH" ]]; then
            echo "protected GGUF path is missing or not a regular file" >&2
            exit 1
          fi
          if [[ ! "$RUSTGRAD_METAL_LLAMA_GGUF_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "protected GGUF SHA-256 must be 64 lowercase hexadecimal characters" >&2
            exit 1
          fi
          if [[ ! "$RUSTGRAD_METAL_LLAMA_REGISTRY_ID" =~ ^[0-9]+$ ]]; then
            echo "protected Metal registry ID must be an unsigned integer" >&2
            exit 1
          fi
          if [[ -z "$RUSTGRAD_METAL_LLAMA_PROMPT" ]]; then
            echo "protected Llama prompt must be nonempty" >&2
            exit 1
          fi
          if [[ ! "$RUSTGRAD_METAL_LLAMA_MAX_NEW_TOKENS" =~ ^[1-9][0-9]{0,3}$ ]] ||
             (( RUSTGRAD_METAL_LLAMA_MAX_NEW_TOKENS > 4096 )); then
            echo "protected max-new-tokens must be between 1 and 4096" >&2
            exit 1
          fi
          if [[ ! "$RUSTGRAD_METAL_LLAMA_PREFILL_SPAN" =~ ^[0-9]{1,4}$ ]] ||
             (( RUSTGRAD_METAL_LLAMA_PREFILL_SPAN < 2 || RUSTGRAD_METAL_LLAMA_PREFILL_SPAN > 4096 )); then
            echo "protected prefill span must be between 2 and 4096" >&2
            exit 1
          fi
          if [[ ! "$RUSTGRAD_METAL_LLAMA_EXPECTED_IDS" =~ ^[0-9]+(,[0-9]+)*$ ]]; then
            echo "protected expected token IDs must be a nonempty comma-separated integer list" >&2
            exit 1
          fi
          for variable in \
            RUSTGRAD_METAL_LLAMA_MODEL_SOURCE \
            RUSTGRAD_METAL_LLAMA_MODEL_LICENSE \
            RUSTGRAD_METAL_LLAMA_MODEL_CONVERSION \
            RUSTGRAD_METAL_LLAMA_ORACLE_NAME \
            RUSTGRAD_METAL_LLAMA_ORACLE_REVISION \
            RUSTGRAD_METAL_LLAMA_ORACLE_COMMAND; do
            value="${!variable:-}"
            if [[ -z "$value" || "$value" == *$'\n'* || "$value" == *$'\r'* ]]; then
              echo "$variable must be nonempty and single-line" >&2
              exit 1
            fi
          done
      - name: Check out exact reviewed revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Authenticate checkout and runner-local model
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$EXPECTED_SHA" ]]; then
            echo "checked-out revision does not match expected_sha" >&2
            exit 1
          fi
          actual_model_sha="$(shasum -a 256 "$RUSTGRAD_METAL_LLAMA_GGUF_PATH" | awk '{print $1}')"
          if [[ "$actual_model_sha" != "$RUSTGRAD_METAL_LLAMA_GGUF_SHA256" ]]; then
            echo "runner-local GGUF does not match the protected SHA-256" >&2
            exit 1
          fi
          for output_path in \
            "$RUSTGRAD_METAL_LLAMA_SCOREBOARD_PATH" \
            "$RUSTGRAD_METAL_LLAMA_ATTESTATION_PATH" \
            "$RUSTGRAD_METAL_LLAMA_SHA256SUMS_PATH"; do
            if [[ -e "$output_path" || -L "$output_path" ]]; then
              echo "live Llama evidence path already exists: $output_path" >&2
              exit 1
            fi
          done
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1d1eb14921d9c2d8ea575663e5fe3a0b57868a05
        with:
          toolchain: 1.89.0
      - name: Generate exact live Metal GGUF Llama scoreboard v2
        shell: bash
        run: |
          set -euo pipefail
          cargo run --release --example metal_llama_generate -- \
            --device 0 \
            --expected-registry-id "$RUSTGRAD_METAL_LLAMA_REGISTRY_ID" \
            --max-new-tokens "$RUSTGRAD_METAL_LLAMA_MAX_NEW_TOKENS" \
            --prefill-span "$RUSTGRAD_METAL_LLAMA_PREFILL_SPAN" \
            --scoreboard "$RUSTGRAD_METAL_LLAMA_SCOREBOARD_PATH" \
            --revision "$EXPECTED_SHA" \
            --expected-ids "$RUSTGRAD_METAL_LLAMA_EXPECTED_IDS" \
            --attestation "$RUSTGRAD_METAL_LLAMA_ATTESTATION_PATH" \
            --model-sha256 "$RUSTGRAD_METAL_LLAMA_GGUF_SHA256" \
            --model-source "$RUSTGRAD_METAL_LLAMA_MODEL_SOURCE" \
            --model-license "$RUSTGRAD_METAL_LLAMA_MODEL_LICENSE" \
            --model-conversion "$RUSTGRAD_METAL_LLAMA_MODEL_CONVERSION" \
            --oracle-name "$RUSTGRAD_METAL_LLAMA_ORACLE_NAME" \
            --oracle-revision "$RUSTGRAD_METAL_LLAMA_ORACLE_REVISION" \
            --oracle-command "$RUSTGRAD_METAL_LLAMA_ORACLE_COMMAND" \
            --workflow-run-url "$RUSTGRAD_METAL_LLAMA_WORKFLOW_RUN_URL" \
            --workflow-run-id "$RUSTGRAD_METAL_LLAMA_WORKFLOW_RUN_ID" \
            -- \
            "$RUSTGRAD_METAL_LLAMA_GGUF_PATH" \
            "$RUSTGRAD_METAL_LLAMA_PROMPT"
      - name: Bind and print live GGUF Llama scoreboard v2 evidence
        shell: bash
        run: |
          set -euo pipefail
          scoreboard_name="$(basename -- "$RUSTGRAD_METAL_LLAMA_SCOREBOARD_PATH")"
          attestation_name="$(basename -- "$RUSTGRAD_METAL_LLAMA_ATTESTATION_PATH")"
          (
            cd "$GITHUB_WORKSPACE"
            set -o noclobber
            shasum -a 256 "$scoreboard_name" "$attestation_name" \
              > "$RUSTGRAD_METAL_LLAMA_SHA256SUMS_PATH"
            shasum -a 256 -c "$RUSTGRAD_METAL_LLAMA_SHA256SUMS_PATH"
          )
          cat "$RUSTGRAD_METAL_LLAMA_SCOREBOARD_PATH"
          cat "$RUSTGRAD_METAL_LLAMA_ATTESTATION_PATH"
          cat "$RUSTGRAD_METAL_LLAMA_SHA256SUMS_PATH"
      - name: Upload live GGUF Llama scoreboard v2 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: metal-live-llama-scoreboard-v2-${{ inputs.expected_sha }}-${{ env.RUSTGRAD_METAL_LLAMA_GGUF_SHA256 }}
          path: |
            ${{ env.RUSTGRAD_METAL_LLAMA_SCOREBOARD_PATH }}
            ${{ env.RUSTGRAD_METAL_LLAMA_ATTESTATION_PATH }}
            ${{ env.RUSTGRAD_METAL_LLAMA_SHA256SUMS_PATH }}
          if-no-files-found: error
          retention-days: 30
