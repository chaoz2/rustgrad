name: Native Transformer Scale Evidence

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed lowercase 40-character commit SHA
        required: true
        type: string

concurrency:
  group: native-transformer-scale-evidence-${{ inputs.expected_sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  larger-fixed-shape:
    name: Larger fixed-shape strict-native CPU training
    runs-on: ubuntu-24.04
    environment: native-transformer-scale-evidence
    timeout-minutes: 45
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - name: Validate requested revision
        shell: bash
        run: |
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "expected_sha must be a lowercase full Git SHA" >&2
            exit 1
          fi
          if [[ "${GITHUB_SHA:-}" != "$EXPECTED_SHA" ]]; then
            echo "workflow dispatch revision does not match expected_sha" >&2
            exit 1
          fi
      - name: Check out exact reviewed revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1d1eb14921d9c2d8ea575663e5fe3a0b57868a05
        with:
          toolchain: 1.89.0
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Record bounded larger Transformer evidence
        shell: bash
        run: bash .github/scripts/record-larger-native-transformer-evidence.sh
      - name: Upload exact-commit evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-cpu-larger-transformer-evidence-${{ inputs.expected_sha }}
          path: native-cpu-larger-transformer-evidence/
          if-no-files-found: error
          retention-days: 30
