name: RustGrad CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Formatting, lint, and compatibility ledger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo check --all-targets
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo run --quiet --bin compatibility_manifest -- --check

  compatibility-manifest-artifact:
    name: Compatibility manifest authoring artifact
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Check out the PR head, not the synthetic merge commit, so maintainers
      # can commit this artifact after an intentional ledger update. The
      # quality job above remains the authoritative stale-manifest check.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --quiet --bin compatibility_manifest -- --write
      - uses: actions/upload-artifact@v4
        with:
          name: compatibility-manifest-${{ github.event.pull_request.head.sha }}
          path: docs/compatibility.json
          if-no-files-found: error

  formatting-patch-artifact:
    name: Formatting authoring patch artifact
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # This produces an exact runner-generated patch for remote-only authoring
      # environments. The quality job remains the authoritative formatting
      # validation and still rejects any uncommitted formatting drift.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt
      - run: cargo fmt
      - run: git diff --binary > rustfmt.patch
      - uses: actions/upload-artifact@v4
        with:
          name: rustfmt-patch-${{ github.event.pull_request.head.sha }}
          path: rustfmt.patch
          if-no-files-found: error

  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets
      - name: Compiled Transformer masked-batch resume smoke
        if: matrix.os == 'ubuntu-latest'
        run: cargo run --quiet --example compiled_transformer_train_resume -- cpu-reuse
      - name: Compiled Transformer complete-module file resume smoke
        if: matrix.os == 'ubuntu-latest'
        run: cargo run --quiet --example compiled_transformer_train_resume -- cpu-file-resume
      - name: Compiled Transformer native CPU complete-module file resume smoke
        if: matrix.os == 'ubuntu-latest'
        run: cargo run --quiet --example compiled_transformer_train_resume -- native-cpu-file-resume
      - name: Compiled Transformer native CPU scoreboard smoke
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -o pipefail
          cargo run --quiet --example compiled_transformer_train_resume -- native-cpu-scoreboard | tee native-cpu-training-scoreboard.json
      - name: Upload native CPU training scoreboard
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-cpu-training-scoreboard-${{ github.sha }}
          path: native-cpu-training-scoreboard.json
          if-no-files-found: error
          retention-days: 30
      - run: cargo test --doc

  address-sanitizer:
    name: AddressSanitizer (Linux)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -Zsanitizer=address -C force-frame-pointers=yes
      ASAN_OPTIONS: detect_leaks=1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2025-08-04
      - uses: Swatinem/rust-cache@v2
        with:
          key: address-sanitizer
      # This regression deliberately leaks quarantined mock blocks when both
      # event recording and stream synchronization fail; normal CI still runs it.
      - run: >-
          cargo test --lib --target x86_64-unknown-linux-gnu --
          --skip cuda::tests::peer_copy_preflight_and_event_failure_never_reuse_uncertain_blocks
