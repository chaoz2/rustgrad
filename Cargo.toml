[package]
name = "rustgrad"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
regex = "1"
